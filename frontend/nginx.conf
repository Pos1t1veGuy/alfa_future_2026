server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Django validates the exact 10 MiB limit; this leaves room for multipart headers.
  client_max_body_size 11m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000;
  }
}
